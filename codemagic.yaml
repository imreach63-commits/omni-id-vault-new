workflows:
  default-workflow:
    name: Build OMNI-ID Vault APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Android directory if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.omniidvault
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
